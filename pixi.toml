[workspace]
name = "project_nova"
description = "Project NOVA - Vision-Language-Action Robotics Platform"
channels = [
  "https://prefix.dev/conda-forge",
]
platforms = ["osx-arm64"]

[target.unix.activation]
scripts = ["install/setup.zsh"]

[feature.build.target.unix.tasks]
build = "colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"

clean = "rm -rf build install log"

rebuild = """
rm -rf build install log &&
colcon build --symlink-install \
--cmake-args \
-DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
-DPython_FIND_VIRTUALENV=ONLY \
-DPython3_FIND_VIRTUALENV=ONLY
"""

###########################
# Common Dependencies
###########################

[dependencies]

# Build tools
python = "*"
compilers = "*"
cmake = "*"
ninja = "*"
make = "*"
pkg-config = "*"
git = "*"

# ROS
rosdep = "*"
colcon-common-extensions = "*"

# Simulation
mujoco-python = "*"

# C++ Libraries
eigen = "*"
opencv = "*"

###########################
# ROS2 Jazzy
###########################

[feature.jazzy]
channels = [
  "https://prefix.dev/robostack-jazzy",
]

[feature.jazzy.dependencies]

# Full ROS Desktop
ros-jazzy-desktop = "*"

# Robot Description
ros-jazzy-xacro = "*"
ros-jazzy-urdf = "*"

# TF
ros-jazzy-tf2 = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-tools = "*"

# Robot State
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"

# Vision
ros-jazzy-cv-bridge = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-vision-msgs = "*"

# Diagnostics
ros-jazzy-diagnostic-msgs = "*"

# Geometry
ros-jazzy-geometry-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-nav-msgs = "*"

# Controllers
ros-jazzy-controller-manager = "*"
ros-jazzy-joint-state-broadcaster = "*"

# Visualization
ros-jazzy-rviz2 = "*"

###########################
# Environments
###########################

[environments]
jazzy = { features = ["jazzy", "build"] }
